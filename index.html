<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ORIGO 3D — Interactive 3D Anatomy &amp; Mechanics</title>
<meta name="color-scheme" content="dark">

<style>
:root{color-scheme:dark;box-sizing:border-box}
html,body{height:100%;margin:0;background:#0B0F19;color:#e2e8f0;overflow:hidden;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none}
canvas{display:block;outline:none}
.glass{background:rgba(15,23,42,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.09);box-shadow:0 10px 40px rgba(0,0,0,.45)}
.btn{padding:.5rem .8rem;border-radius:.75rem;font-size:.8rem;font-weight:600;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#cbd5e1;transition:.2s;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.12)}
.btn.on{background:rgba(6,182,212,.2);border-color:#06B6D4;color:#67e8f9}
.btn.warn{background:rgba(249,115,22,.22);border-color:#F97316;color:#fdba74}
#side{transform:translateY(110%);transition:transform .35s ease}
@media(min-width:768px){#side{transform:translateX(115%)}}
#side.open{transform:none}
#side h4{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:#22d3ee;margin:.9rem 0 .25rem;font-weight:700}
#side p{font-size:.86rem;line-height:1.55;color:#cbd5e1;margin:0}
input[type=range]{width:100%;accent-color:#06B6D4;height:1.4rem}
.hbtn{width:2.5rem;height:2.5rem;display:grid;place-items:center;border-radius:.75rem;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#67e8f9;font-size:1.3rem;line-height:1;flex:none;transition:.2s;cursor:pointer}
.hbtn:hover,.hbtn:active{background:rgba(6,182,212,.22);border-color:#06B6D4}
.sbox{position:relative;flex:1;min-width:0;max-width:30rem;margin-left:auto}
.sbox.full{max-width:none;margin-left:0;width:100%}
.sbox input{width:100%;height:2.5rem;border-radius:.75rem;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);color:#e2e8f0;padding:0 2.2rem;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.sbox input::placeholder{color:#64748b}
.sbox input:focus{border-color:#06B6D4;box-shadow:0 0 0 3px rgba(6,182,212,.22)}
.sbox input::-webkit-search-cancel-button{display:none}
.sbox .si{position:absolute;left:.7rem;top:50%;transform:translateY(-50%);font-size:.95rem;pointer-events:none;opacity:.9}
.sbox .sx{position:absolute;right:.3rem;top:50%;transform:translateY(-50%);width:1.9rem;height:1.9rem;border-radius:.5rem;color:#94a3b8;display:none;font-size:.85rem}
.sbox .sx:hover{color:#fff;background:rgba(255,255,255,.08)}
.cb{width:1.8rem;height:1.8rem;border-radius:999px;display:grid;place-items:center;flex:none;font-size:.7rem;color:#67e8f9;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.cb:hover,.cb:active{background:rgba(6,182,212,.25);border-color:#06B6D4}
#sres{position:fixed;z-index:40;top:calc(env(safe-area-inset-top,0px) + 3.9rem);left:.75rem;right:.75rem;max-width:34rem;margin-left:auto;max-height:min(62vh,28rem);border-radius:1rem;padding:.6rem}
.scr{overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.item{display:flex;align-items:center;gap:.75rem;width:100%;text-align:left;padding:.55rem .7rem;border-radius:.9rem;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);transition:.15s;min-height:3.4rem;cursor:pointer}
.item:hover{background:rgba(6,182,212,.12);border-color:rgba(6,182,212,.5)}
.item.on{background:rgba(6,182,212,.18);border-color:#06B6D4;box-shadow:inset 3px 0 0 #F97316}
.item .ic{width:2.4rem;height:2.4rem;flex:none;display:grid;place-items:center;border-radius:.7rem;background:rgba(15,23,42,.85);border:1px solid rgba(255,255,255,.08);font-size:1.25rem}
.item .nm{font-weight:600;font-size:.92rem;line-height:1.25;color:#f1f5f9;overflow-wrap:anywhere}
.item .ct{font-size:.7rem;color:#94a3b8;margin-top:.15rem}
.item mark{background:rgba(249,115,22,.35);color:#fff;border-radius:.2rem;padding:0 .08rem}
.badge{flex:none;font-size:.68rem;font-weight:700;padding:.05rem .45rem;border-radius:999px;background:rgba(249,115,22,.18);color:#fdba74;border:1px solid rgba(249,115,22,.4)}
.chipb{flex:none;display:inline-flex;align-items:center;gap:.4rem;padding:.4rem .7rem;border-radius:999px;font-size:.78rem;font-weight:600;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#cbd5e1;white-space:nowrap;cursor:pointer}
.chipb.on{background:rgba(6,182,212,.22);border-color:#06B6D4;color:#67e8f9}
.gh{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.55rem .1rem;margin-bottom:.35rem;font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#22d3ee;background:rgba(11,15,25,.9);backdrop-filter:blur(8px)}
#nav{position:fixed;z-index:50;top:0;bottom:0;left:0;width:min(88vw,380px);transform:translateX(-105%);transition:transform .3s ease;display:flex;flex-direction:column;border-radius:0 1.25rem 1.25rem 0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:rgba(11,15,25,.94)}
#nav.open{transform:none}
#navbk{position:fixed;inset:0;z-index:45;background:rgba(2,6,23,.62);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .3s}
#navbk.open{opacity:1;pointer-events:auto}
</style></head>
<body>
<div id="stage" class="fixed inset-0"></div>

<header class="fixed top-0 inset-x-0 z-20 glass flex items-center justify-between gap-2 px-3 sm:px-5 pb-2.5" style="padding-top:calc(env(safe-area-inset-top,0px) + .6rem);border-width:0 0 1px 0">
  <div class="flex items-center gap-2.5 min-w-0">
    <button id="menu" class="hbtn" aria-label="Buka menu katalog">☰</button>
    <svg width="34" height="34" viewBox="0 0 34 34" fill="none"><circle cx="17" cy="17" r="12" stroke="#06B6D4" stroke-width="2"/><path d="M17 5v24M5 17h24" stroke="#F97316" stroke-width="1.5"/><circle cx="17" cy="17" r="3.5" fill="#06B6D4"/></svg>
    <div class="min-w-0 hidden min-[460px]:block"><div class="font-extrabold tracking-[.18em] text-lg leading-none">ORIGO <span class="text-cyan-400">3D</span></div>
    <div class="hidden sm:block text-[11px] text-slate-400 mt-1">Interactive 3D Anatomy &amp; Mechanics</div></div>
  </div>
  <select id="models" class="hidden" aria-label="Pilih objek 3D">
    <optgroup label="Otomotif &amp; Energi"><option value="engine">⚙ Mesin Piston</option><option value="solar">☀ Panel Surya</option></optgroup>
    <optgroup label="Elektromekanik"><option value="motor">🔩 Dinamo (Motor Listrik)</option><option value="fan">🌀 Kipas Angin</option><option value="washer">🧺 Mesin Cuci</option></optgroup>
    <optgroup label="Peralatan Rumah"><option value="iron">♨ Setrika</option><option value="blender">🥤 Blender</option><option value="lamp">💡 Lampu Meja</option></optgroup>
    <optgroup label="Alat &amp; Perabot Tambahan"><option value="drill">🔧 Bor Tangan Listrik</option><option value="pump">💧 Pompa Air (Jet Pump)</option><option value="fridge">🧊 Kulkas</option><option value="oven">🔥 Oven Listrik</option><option value="pendant">🔆 Lampu Gantung</option><option value="ladder">📐 Tangga Lipat</option></optgroup>
    <optgroup label="Pembangkit Listrik"><option value="hydro">🌊 PLTA (Tenaga Air)</option><option value="wind">🌬 PLTB (Turbin Angin)</option><option value="coal">🏭 PLTU (Uap)</option><option value="gu">🔥 PLTGU (Gas &amp; Uap)</option><option value="geo">🌋 PLTP (Panas Bumi)</option><option value="nuke">⚛ PLTN (Nuklir)</option><option value="diesel">🛢 PLTD (Diesel)</option><option value="bio">🌿 PLTBm/Bg (Biomassa &amp; Biogas)</option><option value="wave">〰 PLTL (Gelombang Laut)</option><option value="waste">♻ PLTSa (Sampah)</option></optgroup>
    <optgroup label="Komputer &amp; Periferal"><option value="pccase">🖥 Casing PC &amp; Motherboard</option><option value="cpu">🧠 CPU &amp; Cooler</option><option value="ram">💾 RAM (Memori)</option><option value="gpu">🎮 GPU / Kartu Grafis</option><option value="storage">💽 Storage (SSD &amp; HDD)</option><option value="psu">🔌 PSU (Power Supply)</option><option value="periph">🖱 Monitor, Keyboard &amp; Mouse</option><option value="laptop">💻 Laptop</option></optgroup>
    <optgroup label="Isi Kendaraan Ringan"><option value="brake">🛑 Sistem Rem (Brake)</option><option value="suspension">🔩 Suspensi &amp; Kaki-kaki</option><option value="transmission">⚙ Transmisi CVT</option><option value="battery_auto">🔋 Aki Kendaraan</option><option value="exhaust">💨 Knalpot &amp; Catalytic</option><option value="fuel_sys">⛽ Sistem Bahan Bakar</option></optgroup>
    <optgroup label="Dapur"><option value="stove">🔥 Kompor Gas &amp; Tungku</option><option value="kitchen_sink">🚰 Wastafel Dapur (Bak Cuci)</option><option value="rice_cooker">🍚 Rice Cooker</option></optgroup>
    <optgroup label="Kamar Mandi"><option value="shower_set">🚿 Kran &amp; Shower Mandi</option><option value="toilet">🚽 Kloset Duduk</option><option value="bath_sink">🪞 Wastafel &amp; Cermin</option></optgroup>
    <optgroup label="Jaringan"><option value="wifi_router">📡 Router Wi-Fi</option><option value="fiber_modem">🔴 Modem Fiber / ONT</option><option value="net_switch">🔀 Switch Jaringan</option><option value="access_point">📶 Access Point</option><option value="ethernet_cable">🔌 Kabel LAN &amp; RJ45</option><option value="fiber_cable">💡 Kabel Fiber Optik</option><option value="patch_panel">🗄 Patch Panel</option><option value="server_rack">🗄 Server Rack</option><option value="nas_storage">💾 NAS</option><option value="signal_repeater">📶 Repeater Sinyal</option></optgroup>
    <optgroup label="Elektronik"><option value="wall_outlet">🔌 Stopkontak Dinding</option><option value="power_plug">🔌 Steker</option><option value="power_strip">🔌 Kabel Roll / Terminal</option><option value="mcb_panel">⚡ MCB / Panel Sekring</option><option value="wall_switch">💡 Sakelar Lampu</option><option value="wall_charger">🔋 Adaptor / Charger</option><option value="power_cord">🔌 Kabel Daya (C13)</option><option value="ups_unit">🔋 UPS</option><option value="avr_stabilizer">⚡ Stabilisator / AVR</option><option value="multimeter">📟 Multimeter Digital</option><option value="soldering_iron">🔥 Solder &amp; Dudukan</option></optgroup>
  </select>
  <div class="sbox"><span class="si">🔍</span><input id="hi" type="search" placeholder="Cari objek 3D…" autocomplete="off" enterkeyhint="search" aria-label="Cari objek 3D"><button id="hx" class="sx" aria-label="Hapus pencarian">✕</button></div>
</header>

<div id="chip" class="fixed z-10 flex items-center gap-1 glass rounded-full px-1.5 py-1" style="left:.75rem;top:calc(env(safe-area-inset-top,0px) + 4.2rem);max-width:calc(100vw - 1.5rem)">
  <button id="cp" class="cb" aria-label="Objek sebelumnya">◀</button>
  <button id="cn" class="flex items-center gap-2 min-w-0 px-1 text-left" aria-label="Buka katalog"><span id="cic" class="text-base"></span><span class="min-w-0"><span id="cnm" class="block text-xs font-bold text-white truncate"></span><span id="cct" class="block text-[10px] text-slate-400 truncate"></span></span></button>
  <button id="cx" class="cb" aria-label="Objek berikutnya">▶</button>
</div>
<div id="sres" class="glass scr hidden"></div>
<div id="navbk"></div>
<aside id="nav" class="glass" aria-label="Katalog objek 3D">
  <div class="flex items-center gap-3 p-4 pb-2">
    <svg width="34" height="34" viewBox="0 0 34 34" fill="none"><circle cx="17" cy="17" r="12" stroke="#06B6D4" stroke-width="2"/><path d="M17 5v24M5 17h24" stroke="#F97316" stroke-width="1.5"/><circle cx="17" cy="17" r="3.5" fill="#06B6D4"/></svg>
    <div class="flex-1 min-w-0"><div class="font-extrabold tracking-[.18em] leading-none">ORIGO <span class="text-cyan-400">3D</span></div><div class="text-[11px] text-slate-400 mt-1">Katalog Objek 3D</div></div>
    <button id="navx" class="hbtn" aria-label="Tutup menu">✕</button>
  </div>
  <div id="navinfo" class="px-4 text-xs text-slate-400 leading-relaxed"></div>
  <div class="px-4 pt-3"><div class="sbox full"><span class="si">🔍</span><input id="ni" type="search" placeholder="Cari nama, kategori, kata kunci" autocomplete="off" aria-label="Cari di katalog"><button id="nix" class="sx" aria-label="Hapus pencarian">✕</button></div></div>
  <div id="chips" class="scr flex gap-2 px-4 py-3" style="overflow-x:auto;overflow-y:hidden;touch-action:pan-x"></div>
  <div id="nlist" class="scr flex-1 px-4 pb-6"></div>
</aside>
<div id="alert" class="hidden fixed z-20 left-1/2 -translate-x-1/2 w-[calc(100%-1.5rem)] max-w-xl rounded-xl px-3 py-2 text-sm flex items-center gap-2" style="top:calc(env(safe-area-inset-top,0px) + 6.5rem);background:rgba(127,29,29,.8);border:1px solid #ef4444;backdrop-filter:blur(8px)">
  <span class="text-lg">⚠</span><span id="alert-t" class="flex-1 leading-snug"></span>
  <button id="fixall" class="btn !py-1 !px-2">Pulihkan</button>
</div>
<div id="hint" class="fixed z-10 left-4 text-xs text-slate-400 pointer-events-none hidden sm:block" style="top:calc(env(safe-area-inset-top,0px) + 6.7rem)">Seret = putar · Scroll = zoom · Klik komponen untuk detail</div>
<div id="tip" class="fixed z-40 pointer-events-none hidden px-2.5 py-1 rounded-lg text-xs font-semibold" style="background:rgba(6,182,212,.92);color:#04212a"></div>

<aside id="side" class="fixed z-30 glass rounded-t-2xl md:rounded-2xl bottom-0 inset-x-0 md:inset-x-auto md:right-4 md:w-[340px] max-h-[55vh] md:max-h-none overflow-y-auto p-4 md:top-20 md:bottom-44" style="touch-action:pan-y">
  <div class="flex items-start justify-between gap-2">
    <div><div class="text-[11px] text-slate-400">Komponen terpilih</div><div id="s-name" class="text-lg font-bold text-white leading-tight"></div></div>
    <button id="s-close" class="btn !px-2.5" aria-label="Tutup">✕</button>
  </div>
  <div id="s-status" class="inline-block mt-2 text-[11px] font-bold px-2 py-0.5 rounded-full"></div>
  <h4>Fungsi Utama</h4><p id="s-fn"></p>
  <h4>Cara Kerja Singkat</h4><p id="s-how"></p>
  <h4 style="color:#fb923c">Dampak Jika Rusak</h4><p id="s-imp"></p>
  <button id="s-btn" class="btn warn w-full mt-4 !py-2.5"></button>
</aside>

<section class="fixed z-20 inset-x-0 mx-auto w-[calc(100%-1.5rem)] max-w-2xl glass rounded-2xl p-3 sm:p-4" style="bottom:calc(env(safe-area-inset-bottom,0px) + .75rem)">
  <div class="flex items-center justify-between text-xs mb-1"><span class="font-semibold text-slate-300">Exploded View (Mode Bongkar)</span><span id="ex-v" class="text-cyan-300 font-bold">0%</span></div>
  <input id="ex" type="range" min="0" max="100" value="0">
  <div class="flex flex-wrap gap-2 mt-2">
    <div class="flex gap-1 p-1 rounded-xl bg-white/5">
      <button id="m-normal" class="btn on">Normal</button>
      <button id="m-damage" class="btn">Simulasi Kerusakan</button>
    </div>
    <button id="reset" class="btn">⟲ Reset Kamera</button>
    <button id="auto" class="btn">⟳ Auto-Rotate</button>
  </div>
</section>

<script>
const $=id=>document.getElementById(id);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0B0F19);scene.fog=new THREE.Fog(0x0B0F19,22,48);
const camera=new THREE.PerspectiveCamera(45,1,.1,100);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;renderer.outputEncoding=THREE.sRGBEncoding;
$('stage').appendChild(renderer.domElement);

// Environment (pantulan studio)
(()=>{const c=document.createElement('canvas');c.width=512;c.height=256;const g=c.getContext('2d');const gr=g.createLinearGradient(0,0,0,256);
gr.addColorStop(0,'#6a7b99');gr.addColorStop(.5,'#1c2538');gr.addColorStop(1,'#0b0f19');g.fillStyle=gr;g.fillRect(0,0,512,256);
g.fillStyle='#fff';g.fillRect(60,40,100,30);g.fillRect(300,30,130,24);g.fillStyle='#06B6D4';g.fillRect(200,100,70,14);
const t=new THREE.CanvasTexture(c);t.mapping=THREE.EquirectangularReflectionMapping;t.encoding=THREE.sRGBEncoding;
const p=new THREE.PMREMGenerator(renderer);scene.environment=p.fromEquirectangular(t).texture;t.dispose();p.dispose();})();

scene.add(new THREE.HemisphereLight(0x9bb4ff,0x0b0f19,.7));
const sun=new THREE.DirectionalLight(0xffffff,1.6);sun.position.set(6,10,6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-9,right:9,top:9,bottom:-9,near:1,far:30});sun.shadow.bias=-.0004;scene.add(sun);
const rim=new THREE.PointLight(0x06B6D4,1.2,30);rim.position.set(-6,4,-6);scene.add(rim);

// Lantai, grid & sumbu origo
const grid=new THREE.GridHelper(24,24,0x06B6D4,0x1e293b);grid.material.transparent=true;grid.material.opacity=.55;scene.add(grid);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.ShadowMaterial({opacity:.4}));floor.rotation.x=-Math.PI/2;floor.position.y=.002;floor.receiveShadow=true;scene.add(floor);
[[0xff4d4d,[2.2,0,0]],[0x4dff88,[0,2.2,0]],[0x4d9bff,[0,0,2.2]]].forEach(([c,v])=>{const g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3(...v)]);scene.add(new THREE.Line(g,new THREE.LineBasicMaterial({color:c})));});
const org=new THREE.Mesh(new THREE.SphereGeometry(.08,16,16),new THREE.MeshBasicMaterial({color:0xF97316}));scene.add(org);

const controls=new THREE.OrbitControls(camera,renderer.domElement);
Object.assign(controls,{enableDamping:true,dampingFactor:.08,minDistance:3,maxDistance:26,maxPolarAngle:Math.PI*.495,autoRotateSpeed:1.4});
let tgtGoal=null,posGoal=null;
controls.addEventListener('start',()=>{tgtGoal=null;posGoal=null});

// ---------- Helper ----------
const V=(...a)=>new THREE.Vector3(...a);
const M=(color,metal=.5,rough=.4,em=0,ei=0,extra={})=>{const m=new THREE.MeshStandardMaterial(Object.assign({color,metalness:metal,roughness:rough,emissive:em,emissiveIntensity:ei},extra));m.userData.be=new THREE.Color(em);m.userData.bi=ei;return m;};
const mesh=(geo,mat,x=0,y=0,z=0)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;return m;};
const cylZ=(r,l,mat,x=0,y=0,z=0,seg=24)=>{const g=new THREE.CylinderGeometry(r,r,l,seg);g.rotateX(Math.PI/2);return mesh(g,mat,x,y,z);};
const I=(fn,how,imp,sym)=>({fn,how,imp,sym});
function addPart(root,parts,id,name,obj,dir,info,ghost){const p={id,name,obj,dir:dir,base:obj.position.clone(),info,ghost:!!ghost,meshes:[]};
obj.traverse(o=>{if(o.isMesh){o.userData.part=p;p.meshes.push(o)}});root.add(obj);parts.push(p);return p;}
const grp=(x,y,z)=>{const g=new THREE.Group();g.position.set(x,y,z);return g;};

// ---------- MODEL 1: MESIN PISTON ----------
function buildEngine(){
 const root=new THREE.Group(),parts=[];const P=(...a)=>addPart(root,parts,...a);
 const cy=.6,r=.35,L=1.5,TAU=Math.PI*2;
 const alu=()=>M(0xb4bdcc,.85,.28),steel=()=>M(0x8c97a8,.95,.22);
 // Blok
 const blk=grp(0,0,0);
 const gl=M(0x7c8aa5,.6,.35,0,0,{transparent:true,opacity:.3,side:THREE.DoubleSide,depthWrite:false});
 const w1=mesh(new THREE.CylinderGeometry(.78,.78,1.7,40,1,true),gl,0,2.35,0);
 const w2=mesh(new THREE.BoxGeometry(1.9,1.5,1.2),M(0x7c8aa5,.6,.35,0,0,{transparent:true,opacity:.16,depthWrite:false}),0,.75,0);
 w1.castShadow=w2.castShadow=false;blk.add(w1,w2);
 [1.65,2.05,2.45,2.85].forEach(y=>blk.add(mesh(new THREE.CylinderGeometry(.88,.88,.07,40),M(0x5b6a86,.8,.35),0,y,0)));
 P('block','Blok Silinder',blk,V(0,0,-3),I('Rumah tempat piston bergerak naik-turun sekaligus penopang seluruh mesin.','Dinding silinder yang halus membuat piston meluncur rapat. Sirip-sirip di luarnya membuang panas ke udara agar mesin tidak terlalu panas.','Retak atau panas berlebih (overheat) membuat tenaga turun, piston bisa macet, dan mesin bisa mati total.','mesin terlalu panas, tenaga turun'),true);
 // Piston
 const pis=grp(0,2.1,0);pis.add(mesh(new THREE.CylinderGeometry(.52,.52,.6,32),alu()));

function flow(R,path,cut,spin,cam,def,col,extra){

 return Object.assign(R,{def,cam,update(t,dt){let c=1.01;broken.forEach(id=>{if(id in cut)c=Math.min(c,cut[id])});
  for(let i=0;i<N;i++){const u=(i/N+t*.08)%1;d.position.copy(curve.getPointAt(u));d.scale.setScalar(u<c?1:.0001);d.updateMatrix();inst.setMatrixAt(i,d.matrix)}inst.instanceMatrix.needsUpdate=true;inst.visible=exC<.05;

  lm.emissive.setHex(c>1?0x22ff88:0xff2222);lm.emissiveIntensity=c>1?2:1.2;extra&&extra(t,dt,c);}});
}

 const GK={'Otomotif & Energi':'mobil motor mesin bensin energi surya matahari panel','Elektromekanik':'motor listrik dinamo kipas mesin cuci putar','Peralatan Rumah':'rumah tangga alat elektronik','Alat & Perabot Tambahan':'bor pompa kulkas oven lampu tangga perabot','Pembangkit Listrik':'plt pembangkit energi turbin generator tenaga','Komputer & Periferal':'komputer pc laptop hardware perangkat','Isi Kendaraan Ringan':'mobil motor kendaraan otomotif komponen','Dapur':'masak kompor dapur makan','Kamar Mandi':'mandi toilet wc air','Jaringan':'internet wifi lan network kabel server','Elektronik':'listrik kabel stopkontak elektronik daya'};
 const GI={'Otomotif & Energi':'🚗','Elektromekanik':'⚙️','Peralatan Rumah':'🏠','Alat & Perabot Tambahan':'🧰','Pembangkit Listrik':'⚡','Komputer & Periferal':'🖥️','Isi Kendaraan Ringan':'🚙','Dapur':'🍳','Kamar Mandi':'🛁','Jaringan':'🌐','Elektronik':'🔌'};
 const D=[];sel.querySelectorAll('optgroup').forEach(g=>{const gl=g.label;[...g.children].forEach(o=>{const tx=o.textContent.trim(),m=tx.match(/^(\S+)\s+(.*)$/);D.push({id:o.value,ic:m?m[1]:'▪',name:m?m[2]:tx,g:gl,h:norm(tx+' '+gl+' '+o.value.split('_').join(' ')+' '+(GK[gl]||''))})})});
 const G=[...new Set(D.map(d=>d.g))];
 let cur='',cat='all',q='';
 const hi=$('hi'),ni=$('ni'),sr=$('sres'),nav=$('nav'),bk=$('navbk'),nl=$('nlist'),ch=$('chips');
 const toks=()=>norm(q).replace(/[^a-z0-9]+/g,' ').trim().split(' ').filter(Boolean);
 const match=d=>toks().every(w=>d.h.includes(w));
 const hl=n=>{const t=toks();let s=esc(n);if(!t.length)return s;return s.replace(new RegExp('('+t.join('|')+')','ig'),'<mark>$1</mark>')};
 const item=d=>`<button class="item${d.id===cur?' on':''}" data-id="${d.id}"><span class="ic">${d.ic}</span><span class="min-w-0 flex-1"><span class="nm block">${hl(d.name)}</span><span class="ct block">${GI[d.g]||''} ${esc(d.g)}</span></span>${d.id===cur?'<span class="badge">Aktif</span>':''}</button>`;
 const rd=()=>{const L=D.filter(d=>(cat==='all'||d.g===cat)&&match(d));let h='';
  if(!L.length)h=`<div class="text-center text-slate-400 text-sm py-10">Tidak ada objek untuk “${esc(q)}”.<br><span class="text-xs">Coba kata lain, mis. router, kompor, turbin.</span></div>`;
  else G.forEach(g=>{const a=L.filter(d=>d.g===g);if(a.length)h+=`<div class="gh"><span>${GI[g]||''} ${esc(g)}</span><span class="badge">${a.length}</span></div><div class="space-y-2 pb-3">${a.map(item).join('')}</div>`});
  const st=nl.scrollTop;nl.innerHTML=h;nl.scrollTop=st;
  const cnt=g=>D.filter(d=>(g==='all'||d.g===g)&&match(d)).length,sx=ch.scrollLeft;
  ch.innerHTML=['all',...G].map(g=>`<button class="chipb${cat===g?' on':''}" data-g="${esc(g)}">${g==='all'?'Semua':(GI[g]||'')+' '+esc(g)} <span class="badge">${cnt(g)}</span></button>`).join('');ch.scrollLeft=sx};
 const rs=()=>{if(!q.trim()){sr.classList.add('hidden');return}const L=D.filter(match).slice(0,30);
  sr.innerHTML=L.length?`<div class="text-[11px] text-slate-400 px-1 pb-2">${L.length}${L.length==30?'+':''} hasil · ketuk untuk membuka</div><div class="space-y-2">${L.map(item).join('')}</div>`:`<div class="text-center text-slate-400 text-sm py-6">Tidak ada hasil untuk “${esc(q)}”</div>`;sr.classList.remove('hidden')};
 const setQ=v=>{q=v;if(hi.value!==v)hi.value=v;if(ni.value!==v)ni.value=v;$('hx').style.display=$('nix').style.display=v?'block':'none'};
 const closeNav=()=>{nav.classList.remove('open');bk.classList.remove('open')};
 const openNav=()=>{sr.classList.add('hidden');rd();nav.classList.add('open');bk.classList.add('open');setTimeout(()=>{const a=nl.querySelector('.item.on');a&&a.scrollIntoView({block:'center'})},320)};
 const pick=id=>{if(id!==cur)loadModel(id);closeNav();sr.classList.add('hidden');hi.blur();ni.blur()};
 const step=k=>{const i=D.findIndex(d=>d.id===cur);pick(D[(i+k+D.length)%D.length].id)};
 window.syncNav=k=>{cur=k;const d=D.find(x=>x.id===k);if(d){$('cic').textContent=d.ic;$('cnm').textContent=d.name;$('cct').textContent=d.g}rd()};
 $('navinfo').innerHTML=`Bongkar-pasang objek 3D untuk memahami cara kerja benda dan mesin sehari-hari. Putar dengan satu jari, cubit untuk zoom, ketuk komponen untuk detail.<div class="flex gap-2 mt-2"><span class="badge">${D.length} objek</span><span class="badge">${G.length} kategori</span></div>`;
 hi.oninput=()=>{setQ(hi.value);rd();rs()};hi.onfocus=()=>{if(q.trim())rs()};
 ni.oninput=()=>{setQ(ni.value);rd();sr.classList.add('hidden')};
 $('hx').onclick=()=>{setQ('');rd();rs();hi.focus()};$('nix').onclick=()=>{setQ('');rd();ni.focus()};
 hi.onkeydown=e=>{if(e.key==='Enter'){const f=D.filter(match)[0];if(f)pick(f.id)}};
 ni.onkeydown=e=>{if(e.key==='Enter'){const f=D.filter(d=>(cat==='all'||d.g===cat)&&match(d))[0];if(f)pick(f.id)}};
 const clk=e=>{const b=e.target.closest('.item');if(b)pick(b.dataset.id)};sr.onclick=clk;nl.onclick=clk;
 ch.onclick=e=>{const b=e.target.closest('.chipb');if(b){cat=b.dataset.g;rd()}};
 $('menu').onclick=openNav;$('navx').onclick=closeNav;bk.onclick=closeNav;$('cn').onclick=openNav;$('cp').onclick=()=>step(-1);$('cx').onclick=()=>step(1);
 document.addEventListener('pointerdown',e=>{if(!sr.contains(e.target)&&!e.target.closest('.sbox'))sr.classList.add('hidden')});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeNav();sr.classList.add('hidden');hi.blur()}else if(e.key==='/'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();hi.focus()}});
 setQ('');rd();
})();
$('m-normal').onclick=()=>setMode('normal');$('m-damage').onclick=()=>setMode('damage');
$('fixall').onclick=()=>{broken.clear();mode='normal';refreshUI()};
$('s-close').onclick=()=>setSel(null);
$('s-btn').onclick=()=>{if(!sel)return;broken.has(sel.id)?broken.delete(sel.id):broken.add(sel.id);mode=broken.size?'damage':'normal';refreshUI();};
$('ex').oninput=e=>{exT=e.target.value/100;$('ex-v').textContent=e.target.value+'%';setGoalToSel();};
$('reset').onclick=()=>{posGoal=model.cam.pos.clone();tgtGoal=model.cam.target.clone();};
$('auto').onclick=e=>{controls.autoRotate=!controls.autoRotate;e.currentTarget.classList.toggle('on',controls.autoRotate)};

// Raycaster
const rc=new THREE.Raycaster(),mv=new THREE.Vector2(),cvs=renderer.domElement,tip=$('tip');
function pick(e){const r=cvs.getBoundingClientRect();mv.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);rc.setFromCamera(mv,camera);
 const list=[];model.parts.forEach(p=>p.meshes.forEach(m=>{if(!m.userData.skip)list.push(m)}));const h=rc.intersectObjects(list,false);
 const x=h.find(i=>!i.object.userData.part.ghost)||h[0];return x?x.object.userData.part:null;}
function showTip(p,e){if(p){tip.textContent=p.name;tip.style.left=Math.min(e.clientX+14,innerWidth-190)+'px';tip.style.top=(e.clientY+14)+'px';tip.classList.remove('hidden')}else tip.classList.add('hidden')}
cvs.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||e.buttons)return;hover=pick(e);cvs.style.cursor=hover?'pointer':'grab';showTip(hover,e)});
let dn=null;cvs.addEventListener('pointerdown',e=>{dn={x:e.clientX,y:e.clientY,t:performance.now()};tip.classList.add('hidden')});
cvs.addEventListener('pointerup',e=>{if(!dn)return;const mv=Math.hypot(e.clientX-dn.x,e.clientY-dn.y),dt=performance.now()-dn.t;dn=null;
 if(mv<7&&dt<500){const p=pick(e);if(p)setSel(p);else if(e.pointerType!=='mouse')setSel(null);}});
cvs.addEventListener('pointerleave',()=>{hover=null;tip.classList.add('hidden')});

function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

const CY=new THREE.Color(0x06B6D4);
const clock=new THREE.Clock();let T=0;
loadModel('engine');camera.position.copy(model.cam.pos);controls.target.copy(model.cam.target);posGoal=tgtGoal=null;
(function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);T+=dt;
 exC+=(exT-exC)*Math.min(1,dt*6);
 const pulse=.5+.5*Math.sin(T*6);
 model.parts.forEach(p=>{const b=broken.has(p.id),h=p===hover||p===sel;
  p.meshes.forEach(m=>{if(m.userData.noHl)return;const mt=m.material;
   if(b){mt.emissive.setHex(0xff1a1a);mt.emissiveIntensity=.25+.6*pulse}
   else if(h){mt.emissive.copy(CY);mt.emissiveIntensity=p===hover?.55:.3}
   else{mt.emissive.copy(mt.userData.be);mt.emissiveIntensity=mt.userData.bi}});});
 model.update(T,dt);
 model.parts.forEach(p=>p.obj.position.copy(p.base).addScaledVector(p.dir,exC));
 if(tgtGoal){const n=controls.target.clone().lerp(tgtGoal,.08),d=n.sub(controls.target);controls.target.add(d);if(!posGoal)camera.position.add(d);if(d.length()<.002)tgtGoal=null;}
 if(posGoal){camera.position.lerp(posGoal,.08);if(camera.position.distanceTo(posGoal)<.01)posGoal=null;}
 controls.update();renderer.render(scene,camera);})();
</script>
</body></html>
